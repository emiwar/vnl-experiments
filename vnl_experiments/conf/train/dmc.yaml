# @package train
#
# PPO settings for the dm_control_suite delay experiments.
#
# These are a faithful transcription of the pre-Hydra `train_delays.py`, which is what the
# 90 runs in the `nnx-ppo-delays` project (2026-05-29 to 2026-07-08, delays 0-25) were
# trained with. Keeping them identical is the whole point: a delay sweep is only readable
# against the runs already in that project, and a changed learning rate or advantage scale
# would silently make the new points incomparable rather than wrong-looking.
#
# The old script derived some of these from `brax_ppo_config(env)` and then overrode most
# of them inline. Where it overrode, the literal is written here; where it used brax's
# value, brax's value is written here as a literal too, because brax's defaults are
# per-env and pinning them is what makes one `train=dmc` mean one thing across envs.
# Anything genuinely env-specific (episode length, reward scale) lives on the env group.

ppo:
  # 8192, not brax's 2048: the old script quadrupled it deliberately.
  n_envs: 8192
  # brax's `unroll_length` for every dm_control task.
  rollout_length: 30
  # brax says 60M; the old script ran 8x that, commented "Delays might be slower to
  # train". A delay-25 run is a harder problem than the undelayed baseline brax tuned on.
  total_steps: 480_000_000
  learning_rate: 1.0e-4
  discounting_factor: 0.99
  gae_lambda: 0.95
  clip_range: 0.3
  n_epochs: 4
  n_minibatches: 8
  critic_loss_weight: 1.0
  normalize_advantages: true
  # The old script logged the actor/critic internals and rollout stats, which is what the
  # existing delay analyses read. ROLLOUT_OBS is deliberately absent (it dumps the whole
  # observation pytree).
  logging_level: [LOSSES, THROUGHPUT, ROLLOUT_STATS, CRITIC_EXTRA, ACTOR_EXTRA]
  logging_percentiles: null

# ---------------------------------------------------------------------------------------
# Measurement cadences. Changed 2026-09-15; runs before that date used 600_000 / 6_000_000
# and are a different era for curve *resolution* (not for reward, units or optimisation).
# See analysis/dm_control_suite/where-the-wall-clock-goes/ for the measurement this rests
# on, and analysis/dm_control_suite/README.md for the era boundary.
# ---------------------------------------------------------------------------------------

eval:
  enabled: true
  # 100 evals over the 480M budget, which is the number the old value was *meant* to give:
  # it was brax's 60M / num_evals=100, i.e. 600_000, and it was never rescaled when
  # `total_steps` was multiplied by 8 above -- so a full run ran 800 evals, not 100.
  #
  # That was not free. An eval is `max_episode_length` *sequential* steps over only
  # `n_envs` environments, which is latency-bound rather than throughput-bound, so one
  # eval costs more than one PPO step over 8192 envs on every locomotion task: measured
  # over 116 runs, eval was 58-62 % of the wall clock against 22-27 % for training.
  # At 4.8M it is ~8 %, and a 480M run still gets 100 points (a 1G run gets 208).
  #
  # Raise `n_envs` before lowering this again if the eval looks noisy: more envs in one
  # rollout is nearly free here, more rollouts is not.
  every_steps: 4_800_000
  n_envs: 256
  max_episode_length: 1000
  logging_percentiles: null

video:
  enabled: true
  # 16 videos over the 480M budget, was 80 (brax's 60M / 10, also never rescaled).
  # A video is a 1000-step single-env rollout plus a MuJoCo render plus the upload,
  # 8-15 s each, and 80 of them is 8-16 % of a locomotion run and 28-40 % of a
  # CartpoleSwingup one -- where the task itself is so cheap that the videos dominated.
  every_steps: 30_000_000
  episode_length: 1000
  render_kwargs:
    height: 480
    width: 640

seed: 1234
checkpoint_every_steps: 10_000_000
