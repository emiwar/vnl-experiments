# @package _global_
#
# Flat-observation recurrent actor: pre-MLP -> recurrent stack -> post-MLP -> sampler,
# in place of the plain MLP of conf/net/delayed_mlp.yaml. The dm_control analogue of
# conf/net/recurrent.yaml, and the condition that asks whether recurrence can substitute
# for an explicit efference copy or forward model under delay.
#
# `rnn_hidden_sizes` gives one width per layer, so its length is the depth; setting it to
# [] removes the recurrence altogether, which is the reduction configuration used as a
# control. `rnn_cell` is one of lstm / gru / rnn and appears in the run name
# (WalkerWalk_DelayedGRU_delay5_eff5), so the three cells stay distinguishable in the run
# index without parsing config.
#
# Requires a flat-obs env (`env=dmc/...`). See conf/net/encdec.yaml for how groups compose.

defaults:
  - /net_defaults@net: FlatRecurrent
  - _self_

net_spec:
  architecture: FlatRecurrent

net: {}
