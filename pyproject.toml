[project]
name = "vnl_experiments"
version = "0.1.0"
description = "Experiments with rodent imitation."
authors = [
    { name="Emil Wärnberg", email="ewarnberg@fas.harvard.edu" }
]

dependencies = [
    "flax>=0.12.4",
    "jax[cuda12]",
    "ml_collections",
    "orbax-checkpoint",
    "jaxtyping",
    "numpy",
    "wandb",
    "nnx-ppo==0.3.0-dev",
    "vnl-playground",
]

[project.optional-dependencies]
dev = ["brax"]
analysis = ["pandas", "matplotlib", "seaborn"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["vnl_experiments"]
python_files = ["*_test.py", "test_*.py"]
# `tools/` holds interactive diagnostics, one of which is named *_test.py but is a
# gamepad probe, not a test. The rest are directories pytest has no business walking.
norecursedirs = [
    "analysis", "artifacts", "checkpoints", "downloaded_checkpoints", "wandb",
    "eval_results", "vnl_experiments/tools",
]

[tool.setuptools.packages.find]
exclude = ["downloaded_checkpoints*", "checkpoints*", "wandb*"]

[tool.setuptools.package-data]
# The Hydra config groups are data, not modules, so they need declaring or a
# non-editable install would have no configuration to compose. The golden-test fixtures
# travel with the tests for the same reason.
vnl_experiments = ["conf/**/*.yaml", "**/testdata/**/*.json"]
